# =============================================================================
# TaaOS Calamares Post-Install Configuration
# =============================================================================
# This module runs after installation completes to configure the installed
# system as a full operating system
# =============================================================================

# Script to run after installation
script: /usr/lib/taaos/post-install.sh

# Chroot into installed system
chroot: true

# Run in target system
runInTarget: true

# Preserve environment
preserveEnvironment: false

# Timeout in seconds
timeout: 300