# =============================================================================
# TaaOS Calamares Partition Module Configuration
# =============================================================================
# Configures disk partitioning for full OS installation
# Supports: GPT/MSDOS, LVM, LUKS encryption, RAID
# =============================================================================

# Default filesystem type
defaultFileSystemType: "ext4"

# Available filesystem types
availableFileSystemTypes:
  - ext4
  - btrfs
  - xfs
  - f2fs
  - jfs

# Enable swap file (instead of swap partition)
enableSwapFile: true

# Swap file size in MiB (8GB)
swapFileSize: 8192

# Enable LVM
enableLvmInstall: true

# Enable LUKS encryption
enableLuksAutomatedPartitioning: true

# LUKS encryption key size
luksGeneration: luks2

# Minimum partition size for root in MiB (20GB)
minRootPartitionSize: 20480

# Minimum RAM for swap calculation in MiB
minRamForSwap: 2048

# EFI partition size in MiB (512MB)
efiPartitionSize: 512

# EFI partition name
efiPartitionName: "EFI System"

# Boot partition size in MiB (1GB)
bootPartitionSize: 1024

# Boot partition name
bootPartitionName: "boot"

# Allow manual partitioning
allowManualPartitioning: true

# Initial partitioning choice
# - erase: Erase entire disk
# - alongside: Install alongside existing OS
# - replace: Replace a partition
# - manual: Manual partitioning
initialPartitioningChoice: erase

# Initial swap choice
# - none: No swap
# - small: 2GB swap
# - suspend: Swap = RAM size (for hibernate)
# - file: Swap file
initialSwapChoice: small

# Partition layout preset
partitionLayout:
  - mountPoint: /boot/efi
    size: 512MiB
    filesystem: fat32
    flags: [ boot, esp ]
  - mountPoint: /boot
    size: 1GiB
    filesystem: ext4
    flags: [ boot ]
  - mountPoint: /
    size: 50GiB
    filesystem: ext4
  - mountPoint: /home
    size: 100%
    filesystem: ext4

# Require password for LUKS
requireLuksPassword: true

# Show advanced partitioning options
showAdvancedPartitioningOptions: true

# Always show partition information
alwaysShowPartitionInformation: true

# Allow ZFS (if available)
allowZfs: false

# Preserve logs during install
preserveLogs: true