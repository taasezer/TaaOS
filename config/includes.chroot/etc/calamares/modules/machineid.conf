---
# In a systemd-free system, setting "systemd-style" creates /etc/machine-id
# directly without calling the external systemd-machine-id-setup binary.
systemd: "systemd-style"

# Whether to create /var/lib/dbus/machine-id for D-Bus.
dbus: true

# Whether /var/lib/dbus/machine-id should be a symlink to /etc/machine-id
symlink: true
dbus-symlink: true

# Whether to copy entropy from the host
entropy-copy: false
