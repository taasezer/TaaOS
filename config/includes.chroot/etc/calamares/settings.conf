# TaaOS Calamares Installer Configuration
# https://github.com/calamares/calamares

---
modules-search: [ local, /usr/lib/calamares/modules ]

# Installation sequence
sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader
    - umount
  - show:
    - finished

# Branding settings
branding: taaos

# Prompt for user confirmation
prompt-install: true

# Don't close installer on failure (allow user to see logs)
dont-chroot: false
