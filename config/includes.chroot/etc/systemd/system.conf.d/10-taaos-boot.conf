# TaaOS Boot Optimization
# Reduce service timeouts for faster boot

[Manager]
# Timeout for services to start (default: 90s)
DefaultTimeoutStartSec=30s

# Timeout for services to stop (default: 90s)
DefaultTimeoutStopSec=10s

# Log level (reduce for faster boot)
LogLevel=warning

# Limit crash dumps
DefaultLimitCORE=0
