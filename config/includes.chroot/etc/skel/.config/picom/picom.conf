# TaaOS Picom Compositor — Fluid TaaOS Style
backend = "glx";

# Fading & Fluid Transitions
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 4;
no-fading-openclose = false;
no-fading-destroyed-argb = true;

# Opacity
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
focus-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'"
];

# Corners (Smooth Rounding)
corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Shadows
shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.35;
shadow-exclude = [
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# VSync
vsync = true;

# Wintypes for Alt-Tab, Menus and Dialogs
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.98; shadow = true; };
  dropdown_menu = { opacity = 0.98; shadow = true; };
  utility = { opacity = 0.98; shadow = true; };
  dialog = { opacity = 1.0; shadow = true; };
  normal = { fade = true; shadow = true; };
};
