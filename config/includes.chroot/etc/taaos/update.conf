# TaaOS Update System Configuration
# Repository URL for updates
REPO_URL="https://raw.githubusercontent.com/taasezer/TaaOS/main/releases"

# Enable automatic update checks (true/false)
AUTO_CHECK=true

# Enable automatic update installation (true/false)
# WARNING: Only enable if you trust the update source completely
AUTO_INSTALL=false

# Update check interval (handled by systemd timer)
# Default: daily at 3 AM
