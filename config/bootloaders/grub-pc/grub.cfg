# TaaOS BIOS/PC GRUB Configuration - Dynamic KMS & Auto-Resize
set default="0"
set timeout=2
set timeout_style=menu

# Load essential modules
insmod part_msdos
insmod part_gpt
insmod ext2
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod png
insmod gzio
insmod normal
insmod boot

# Set graphics
set gfxmode=1920x1080,1600x900,1366x768,1280x800,auto
set gfxpayload=keep

# Initialize terminal properly
if terminal_output gfxterm; then
    terminal gfxterm
else
    terminal console
fi

# Set theme if available
if [ -f /boot/grub/theme/theme.txt ]; then
    set theme=/boot/grub/theme/theme.txt
fi

# TaaOS Live (Default - Full KMS & Dynamic Display Auto-Resize)
menuentry "TaaOS Live" --class taaos --class os --hotkey=l {
    linux /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}

# TaaOS Live (Safe Mode - VESA Fallback)
menuentry "TaaOS Live (Safe Mode - nomodeset)" --class taaos --class os {
    linux /live/vmlinuz boot=live components nomodeset quiet splash
    initrd /live/initrd.img
}

# TaaOS Live (Debug Mode - TTY for troubleshooting)
menuentry "TaaOS Live (Debug/TTY)" --class taaos --class os --hotkey=d {
    linux /live/vmlinuz boot=live components nomodeset debug console=tty1
    initrd /live/initrd.img
}

# TaaOS Live (Recovery)
menuentry "TaaOS Live (Recovery)" --class taaos --class os {
    linux /live/vmlinuz boot=live components single nomodeset
    initrd /live/initrd.img
}

# Boot from local drive (BIOS)
menuentry "Boot from local drive" --class os --hotkey=b {
    insmod chain
    chainloader (hd0)+1 || chainloader +1
}
