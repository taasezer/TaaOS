# TaaOS EFI GRUB Configuration - FIXED for VM/UEFI Boot
set default="0"
set timeout=10
set timeout_style=menu

# Load essential modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod png
insmod gzio
insmod normal
insmod boot

# Set graphics
set gfxmode=auto
set gfxpayload=keep

# Initialize terminal properly
if terminal_output gfxterm; then
    terminal gfxterm
else
    terminal console
fi

# Set theme if available
if [ -f /boot/grub/theme/theme.txt ]; then
    set theme=/boot/grub/theme/theme.txt
fi

# TaaOS Live (Safe Mode for VMs)
menuentry "TaaOS Live (Safe Mode - VMs)" --class taaos --class os --hotkey=l {
    linux /live/vmlinuz boot=live components noefi nomodeset quiet splash
    initrd /live/initrd.img
}

# TaaOS Live (Normal Mode)
menuentry "TaaOS Live (Normal)" --class taaos --class os {
    linux /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}

# TaaOS Live (Debug Mode - TTY for troubleshooting)
menuentry "TaaOS Live (Debug/TTY)" --class taaos --class os --hotkey=d {
    linux /live/vmlinuz boot=live components nomodeset debug console=tty1
    initrd /live/initrd.img
}

# TaaOS Live (Recovery)
menuentry "TaaOS Live (Recovery)" --class taaos --class os {
    linux /live/vmlinuz boot=live components single nomodeset
    initrd /live/initrd.img
}

# TaaOS Installer
menuentry "TaaOS Installer" --class taaos --class os --hotkey=i {
    linux /install/vmlinuz vga=788 --- quiet
    initrd /install/initrd.gz
}

# Boot from local drive (UEFI)
menuentry "Boot from local drive" --class os --hotkey=b {
    insmod chain
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi || chainloader (hd0,gpt1)/EFI/Microsoft/Boot/bootmgfw.efi || chainloader (hd0,1)+1
}

# UEFI Firmware Settings
menuentry "UEFI Firmware Settings" --class os --hotkey=u {
    fwsetup
}
